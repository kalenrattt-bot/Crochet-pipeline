<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crochet Pipeline v5</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;600;700;800&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#080808;--surface:#0f0f0f;--surface2:#161616;--border:#1f1f1f;--border2:#2a2a2a;
  --text:#e8e8e8;--muted:#555;
  --gpt:#f59e0b;--gpt-bg:#1c1200;--gpt-border:#2e1f00;
  --kling:#a78bfa;--kling-bg:#130d2b;--kling-border:#231545;
  --accent:#f97316;
}
body{font-family:'Syne',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:20px 16px}
.header{margin-bottom:24px}
.header h1{font-size:20px;font-weight:800;letter-spacing:-0.5px;color:#fff}
.header h1 span{color:var(--accent)}
.header p{font-size:11px;color:var(--muted);margin-top:3px;font-family:'DM Mono',monospace}
.global-refs{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:14px}
.section-title{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin-bottom:10px}
.refs-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ref-label{font-size:10px;color:var(--muted);display:block;margin-bottom:4px;font-family:'DM Mono',monospace}
.ref-upload{display:flex;flex-direction:column;gap:3px}
.ref-upload-row{display:flex;align-items:center;gap:5px}
.ubtn{font-size:10px;padding:3px 9px;border:1px solid var(--border2);border-radius:5px;background:var(--surface2);color:#aaa;cursor:pointer;white-space:nowrap;font-family:'DM Mono',monospace}
.ubtn:hover{background:#1e1e1e;color:#ddd}
input[type=file]{display:none}
.iprev{width:26px;height:26px;border-radius:3px;object-fit:cover;display:none;border:1px solid var(--border2)}
.iurl{width:100%;font-size:10px;padding:3px 7px;border:1px solid var(--border);border-radius:5px;background:var(--surface2);color:#ccc;outline:none;font-family:'DM Mono',monospace}
.iurl:focus{border-color:var(--border2)}
.vcard{background:var(--surface);border:1px solid var(--border);border-radius:12px;margin-bottom:10px;overflow:hidden}
.vhead{padding:12px 14px;display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none}
.vhead:hover{background:var(--surface2)}
.vnum{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;background:var(--surface2);color:var(--muted);flex-shrink:0;font-family:'DM Mono',monospace}
.vtitle{flex:1;font-size:13px;font-weight:700;letter-spacing:-0.2px}
.chev{font-size:12px;color:var(--muted);transition:transform .2s}
.chev.o{transform:rotate(180deg)}
.vbody{display:none;border-top:1px solid var(--border)}
.vbody.o{display:block}
.clips{padding:10px;display:flex;flex-direction:column;gap:8px}
.clip{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:11px}
.clip-head{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.clip-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);flex:1;font-family:'DM Mono',monospace}
.mtag{font-size:9px;padding:2px 7px;border-radius:4px;font-weight:700;font-family:'DM Mono',monospace}
.tgpt{background:var(--gpt-bg);color:var(--gpt);border:1px solid var(--gpt-border)}
.tkling{background:var(--kling-bg);color:var(--kling);border:1px solid var(--kling-border)}
.clip-notes{font-size:10px;color:#3a3a3a;background:#0a0a0a;border:1px solid var(--border);border-radius:5px;padding:5px 9px;margin-bottom:7px;font-family:'DM Mono',monospace;line-height:1.5}
.prompt-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:3px}
.prompt-label{font-size:9px;color:var(--muted);font-family:'DM Mono',monospace;text-transform:uppercase;letter-spacing:.08em}
.edit-btn{font-size:9px;padding:2px 7px;border:1px solid var(--border2);border-radius:4px;background:transparent;color:var(--muted);cursor:pointer;font-family:'DM Mono',monospace}
.edit-btn:hover{color:var(--text);border-color:#444}
.clip-prompt-text{font-size:11px;color:#555;line-height:1.5;background:#0a0a0a;border:1px solid var(--border);border-radius:5px;padding:7px 9px;font-family:'DM Mono',monospace;margin-bottom:7px}
.clip-prompt-edit{width:100%;font-size:11px;color:#ccc;line-height:1.5;background:#0a0a0a;border:1px solid var(--kling-border);border-radius:5px;padding:7px 9px;font-family:'DM Mono',monospace;margin-bottom:7px;resize:vertical;min-height:70px;outline:none;display:none}
.settings-row{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px;align-items:center}
.setting-select{font-size:10px;padding:3px 7px;border:1px solid var(--border2);border-radius:4px;background:var(--surface);color:#aaa;font-family:'DM Mono',monospace;outline:none;cursor:pointer}
.setting-toggle{font-size:10px;padding:3px 9px;border:1px solid var(--border2);border-radius:4px;background:var(--surface);color:#aaa;font-family:'DM Mono',monospace;cursor:pointer;user-select:none}
.setting-toggle.on{background:#071825;color:#38bdf8;border-color:#0e2d42}
.chain-row{font-size:10px;color:#252525;font-style:italic;margin-bottom:7px;font-family:'DM Mono',monospace}
.btn-row{display:flex;gap:6px}
.run-btn{flex:1;padding:7px;border:none;border-radius:6px;font-size:11px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px;transition:all .15s;font-family:'Syne',sans-serif}
.run-btn:disabled{opacity:.35;cursor:not-allowed}
.run-btn.rg{background:var(--gpt-bg);color:var(--gpt);border:1px solid var(--gpt-border)}.run-btn.rg:hover:not(:disabled){background:#261a00}
.run-btn.rk{background:var(--kling-bg);color:var(--kling);border:1px solid var(--kling-border)}.run-btn.rk:hover:not(:disabled){background:#1c1040}
.rarea{margin-top:7px}
.smsg{font-size:11px;padding:8px;text-align:center;background:#0a0a0a;border:1px solid var(--border);border-radius:5px;font-family:'DM Mono',monospace}
.sl{color:var(--kling)}.se{color:#f87171}.ss{color:var(--gpt)}
.rimg{width:100%;aspect-ratio:9/16;object-fit:cover;border-radius:6px;display:block;border:1px solid var(--border);margin-bottom:5px}
.rimg.landscape{aspect-ratio:16/9}.rimg.square{aspect-ratio:1/1}
.rvid{width:100%;aspect-ratio:9/16;border-radius:6px;display:block;border:1px solid var(--border);margin-bottom:5px}
.rvid.landscape{aspect-ratio:16/9}.rvid.square{aspect-ratio:1/1}
.result-btns{display:flex;gap:5px}
.pbtn{flex:1;padding:5px;border:1px solid var(--gpt-border);border-radius:5px;background:transparent;color:var(--gpt);font-size:10px;cursor:pointer;font-family:'DM Mono',monospace}
.pbtn:hover{background:var(--gpt-bg)}
.dbtn{flex:1;padding:5px;border:1px solid var(--border2);border-radius:5px;background:transparent;color:#888;font-size:10px;cursor:pointer;font-family:'DM Mono',monospace;text-align:center;text-decoration:none;display:block}
.dbtn:hover{background:var(--surface2);color:#ccc}
</style>
</head>
<body>
<div class="header">
  <h1>🌸 Crochet <span>Pipeline</span> v5</h1>
  <p>gpt image 2 → kling 3.0 // reveal hook + progression + showcase</p>
</div>

<div class="global-refs">
  <div class="section-title">Global References</div>
  <div class="refs-grid" id="grefgrid"></div>
</div>

<div id="pipeline"></div>

<script>
const PROXY = 'https://crochet-proxy.kalenrattt.workers.dev/';

const STORE = {
  girl: 'https://i.ibb.co/hx9BWcYk/b8c6e5d1a850216f407402376a826deb.jpg',
  stall: 'https://i.ibb.co/QFy18YnS/Stallphoto1.jpg',
  garage: 'https://i.ibb.co/XfB0LL4D/83b912ea00c0113ad43d6ecc077330fc-1780564197-fastag2a.jpg',
  blue_bouquet: 'https://i.ibb.co/QvyqVxPj/Blue.jpg',
  pink_bouquet: 'https://i.ibb.co/0RSL2JZ5/Pink.jpg',
  yellow_bouquet: 'https://i.ibb.co/k6g4MLJk/Yellow.jpg',
  extra1: '', extra2: '', extra3: ''
};
const get = k => STORE[k]||null;
const set = (k,v) => { STORE[k]=v; };

const GLOBALS = [
  {key:'girl',label:'Girl ref'},{key:'stall',label:'Stall ref'},{key:'garage',label:'Garage ref'},
  {key:'blue_bouquet',label:'Blue bouquet'},{key:'pink_bouquet',label:'Pink bouquet'},{key:'yellow_bouquet',label:'Yellow bouquet'},
  {key:'extra1',label:'Extra ref 1'},{key:'extra2',label:'Extra ref 2'},{key:'extra3',label:'Extra ref 3'}
];

const VIDEOS = [
  {
    id:'v1', title:'Video — Reveal Hook + Progression + Showcase',
    clips:[
      {
        id:'c1', label:'Clip 1 — Hook Image (Before Reveal)', model:'gpt', type:'image', outputKey:'c1_img',
        refs:['girl','stall','blue_bouquet'],
        notes:'👗 Oversized plain crewneck, jeans | 📍 Outdoor expo, centre table with cloth covering bouquets | 👥 People around filming | 🎬 Freeze frame, hand on cloth about to lift',
        prompt:'The girl from the reference images is standing at her own table at a busy outdoor expo. Oversized plain crewneck and jeans. Her table has a cloth draped over it hiding the bouquets underneath. People around are holding phones filming her. She has her hand on the cloth about to lift it, counting down. Bystander POV, candid. Natural daylight. Freeze frame. No UI, no grain, no colour grading. iPhone 14 quality.',
        aspect:'9:16', resolution:'1K'
      },
      {
        id:'c2', label:'Clip 1 — Hook Video', model:'kling', type:'video',
        refs:['c1_img'],
        notes:'🎬 Kling — she counts 3-2-1, lifts cloth to reveal bouquets, people laugh, she stands disappointed',
        prompt:'The girl counts down 3 2 1 and lifts the cloth off her table to reveal her crochet flower bouquets. The people around her start laughing and snickering. She stands there with a disappointed blank expression watching them laugh. Candid bystander POV. Camera mostly still. Natural daylight. No UI. iPhone 14 quality.',
        aspect:'9:16', duration:'5', mode:'std', sound:true
      },
      {
        id:'c3', label:'Clip 2 — Crocheting Kitchen Image', model:'gpt', type:'image', outputKey:'c3_img',
        refs:['girl','blue_bouquet'],
        notes:'👗 Oversized crewneck | 📍 Kitchen counter, natural daylight | 🎬 She is the main focus, just starting a flower, early stitches',
        prompt:'The girl from the references is standing at her kitchen counter crocheting the very beginning of a small blue flower. She is the main focus — upper body and face visible, looking down at her work. Just the first few stitches done. Natural daylight. She does not know she is being filmed. Candid angle. Freeze frame. No UI, no grain, no colour grading. iPhone 14 quality.',
        aspect:'9:16', resolution:'1K'
      },
      {
        id:'c4', label:'Clip 2 — Crocheting Kitchen Video', model:'kling', type:'video',
        refs:['c3_img'],
        notes:'🎬 Kling — 3s, just hands crocheting, slow, stable camera',
        prompt:'The girl is standing at her kitchen counter crocheting the beginning of a small blue flower. She is the main focus, upper body visible, looking down at her work. Slow careful movements. Does not know she is being filmed. Fixed stable camera. Natural daylight. No UI. iPhone 14 quality.',
        aspect:'9:16', duration:'3', mode:'std', sound:false
      },
      {
        id:'c5', label:'Clip 3 — Crocheting Bedroom Floor Image', model:'gpt', type:'image', outputKey:'c5_img',
        refs:['girl','blue_bouquet'],
        notes:'👗 Plain casual hoodie — different to clip 1 | 📍 Bedroom floor, sitting cross legged | 🎬 Flower halfway done',
        prompt:'The girl from the references is sitting cross legged on a bedroom floor in a plain casual hoodie. She is the main focus — face and upper body visible, crocheting a blue flower that is now halfway complete. Does not know she is being filmed. Natural daylight from a window. Candid angle. Freeze frame. No UI, no grain, no colour grading. iPhone 14 quality.',
        aspect:'9:16', resolution:'1K'
      },
      {
        id:'c6', label:'Clip 3 — Crocheting Bedroom Floor Video', model:'kling', type:'video',
        refs:['c5_img'],
        notes:'🎬 Kling — 3s, halfway done flower, stable camera, eyes on work',
        prompt:'The girl is sitting on the bedroom floor crocheting a halfway complete blue flower. Slow deliberate movements. Does not know she is being filmed. Eyes on her work. Fixed stable camera. Natural daylight. No UI. iPhone 14 quality.',
        aspect:'9:16', duration:'3', mode:'std', sound:false
      },
      {
        id:'c7', label:'Clip 4 — Crocheting Couch Image', model:'gpt', type:'image', outputKey:'c7_img',
        refs:['girl','blue_bouquet'],
        notes:'👗 Simple plain t-shirt | 📍 Couch by window, natural backlight | 🎬 Flower almost complete',
        prompt:'The girl from the references is sitting on a couch with a window behind her. Plain t-shirt. She is the main focus — face and upper body visible, crocheting a blue flower almost complete. Does not know she is being filmed. Candid angle. Freeze frame. No UI, no grain, no colour grading. iPhone 14 quality.',
        aspect:'9:16', resolution:'1K'
      },
      {
        id:'c8', label:'Clip 4 — Crocheting Couch Video', model:'kling', type:'video',
        refs:['c7_img'],
        notes:'🎬 Kling — 3s, almost done, backlit window, stable',
        prompt:'The girl is sitting on a couch by a window crocheting an almost complete blue flower. Slow careful movements, nearly done. Does not know she is being filmed. Fixed stable camera, natural backlight from window. No UI. iPhone 14 quality.',
        aspect:'9:16', duration:'3', mode:'std', sound:false
      },
      {
        id:'c9', label:'Clip 5 — Finishing Touches Image', model:'gpt', type:'image', outputKey:'c9_img',
        refs:['girl','blue_bouquet'],
        notes:'👗 Plain crewneck | 📍 Kitchen standing, minimal background | 🎬 Very last stitches on completed flower',
        prompt:'The girl from the references is standing in her kitchen doing the very last finishing stitches on a completed blue crochet flower. Plain crewneck. Minimal kitchen background. Focused. Does not know she is being filmed. Freeze frame. Natural daylight. No UI, no grain, no colour grading. iPhone 14 quality.',
        aspect:'9:16', resolution:'1K'
      },
      {
        id:'c10', label:'Clip 5 — Finishing Touches Video', model:'kling', type:'video',
        refs:['c9_img'],
        notes:'🎬 Kling — 3s, very last stitches, satisfying',
        prompt:'The girl is standing in her kitchen doing the very last few stitches on a completed blue crochet flower. Slow and careful, almost done. Does not know she is being filmed. Fixed stable camera. Natural daylight. No UI. iPhone 14 quality.',
        aspect:'9:16', duration:'3', mode:'std', sound:false
      },
      {
        id:'c11', label:'Clip 6 — Showcase Image', model:'gpt', type:'image', outputKey:'c11_img',
        refs:['girl','blue_bouquet','pink_bouquet','yellow_bouquet'],
        notes:'👗 Clean simple outfit | 📍 Bedroom, standing | 🎬 Holding blue bouquet, plain faced, looking at camera',
        prompt:'The girl from the references is standing in her bedroom holding up the blue crochet bouquet at chest height. Plain neutral expression, not smiling, looking at camera. Clean bedroom background, natural daylight. Simple casual outfit. No UI, no grain, no colour grading. iPhone 14 quality.',
        aspect:'9:16', resolution:'1K'
      },
      {
        id:'c12', label:'Clip 6 — Showcase Video', model:'kling', type:'video',
        refs:['c11_img'],
        notes:'🎬 Kling — 5s, blue → yellow → pink, plain faced throughout',
        prompt:'The girl is standing in her bedroom holding up the blue crochet bouquet with a plain neutral expression. She slowly lowers it and raises the yellow crochet bouquet, then transitions to the pink crochet bouquet. Plain faced throughout, not smiling, looking at camera. Fixed camera. Natural daylight. No UI. iPhone 14 quality.',
        aspect:'9:16', duration:'5', mode:'std', sound:false
      }
    ]
  }
];

function toB64(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file);});}

function renderGlobals(){
  const grid=document.getElementById('grefgrid');
  GLOBALS.forEach(g=>{
    const d=document.createElement('div');
    d.innerHTML=`<label class="ref-label">${g.label}</label><div class="ref-upload"><div class="ref-upload-row"><label class="ubtn" for="gf_${g.key}">📎</label><input type="file" id="gf_${g.key}" accept="image/*"><img class="iprev" id="gp_${g.key}" src="${get(g.key)||''}" style="${get(g.key)?'display:block':''}"></div><input type="text" class="iurl" id="gu_${g.key}" placeholder="paste URL" value="${get(g.key)||''}"></div>`;
    grid.appendChild(d);
    setTimeout(()=>{
      document.getElementById('gf_'+g.key).addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;const b=await toB64(f);set(g.key,b);const p=document.getElementById('gp_'+g.key);p.src=b;p.style.display='block';});
      document.getElementById('gu_'+g.key).addEventListener('blur',e=>{const v=e.target.value.trim();if(v){set(g.key,v);const p=document.getElementById('gp_'+g.key);p.src=v;p.style.display='block';}});
    },0);
  });
}

function renderPipeline(){
  const cont=document.getElementById('pipeline');
  VIDEOS.forEach((vid,vi)=>{
    const card=document.createElement('div');card.className='vcard';
    const head=document.createElement('div');head.className='vhead';
    head.innerHTML=`<div class="vnum">${vi+1}</div><div class="vtitle">${vid.title}</div><div class="chev o" id="ch_${vid.id}">▾</div>`;
    const body=document.createElement('div');body.className='vbody o';body.id='vb_'+vid.id;
    const clips=document.createElement('div');clips.className='clips';
    vid.clips.forEach(c=>clips.appendChild(buildClip(c)));
    body.appendChild(clips);card.appendChild(head);card.appendChild(body);cont.appendChild(card);
    head.addEventListener('click',()=>{body.classList.toggle('o');document.getElementById('ch_'+vid.id).classList.toggle('o',body.classList.contains('o'));});
  });
}

function buildClip(clip){
  const div=document.createElement('div');div.className='clip';
  const mc={gpt:'tgpt',kling:'tkling'};
  const ml={gpt:'GPT Image 2',kling:'Kling 3.0'};
  const bc={gpt:'rg',kling:'rk'};
  const bt=clip.type==='image'?'🖼 Generate Image':'🎬 Generate Video';
  const chains=clip.refs.filter(r=>r.includes('_img')).map(r=>`<div class="chain-row">↳ uses ${r} from previous step</div>`).join('');
  let settingsHtml='';
  if(clip.type==='image'){
    settingsHtml=`<div class="settings-row"><select class="setting-select" id="res_${clip.id}"><option value="1K" selected>1K</option><option value="2K">2K</option><option value="4K">4K</option></select><select class="setting-select" id="ar_${clip.id}"><option value="9:16" ${clip.aspect==='9:16'?'selected':''}>9:16</option><option value="16:9" ${clip.aspect==='16:9'?'selected':''}>16:9</option><option value="1:1">1:1</option></select></div>`;
  } else {
    settingsHtml=`<div class="settings-row"><select class="setting-select" id="dur_${clip.id}"><option value="3" ${clip.duration==='3'?'selected':''}>3s</option><option value="4" ${clip.duration==='4'?'selected':''}>4s</option><option value="5" ${clip.duration==='5'?'selected':''}>5s</option><option value="6" ${clip.duration==='6'?'selected':''}>6s</option></select><select class="setting-select" id="ar_${clip.id}"><option value="9:16" ${clip.aspect==='9:16'?'selected':''}>9:16</option><option value="16:9">16:9</option><option value="1:1">1:1</option></select><select class="setting-select" id="mode_${clip.id}"><option value="std">std</option><option value="pro">pro</option></select><span class="setting-toggle ${clip.sound?'on':''}" id="snd_${clip.id}" onclick="toggleSound('${clip.id}')">🔊 ${clip.sound?'on':'off'}</span></div>`;
  }
  div.innerHTML=`<div class="clip-head"><span class="clip-label">${clip.label}</span><span class="mtag ${mc[clip.model]}">${ml[clip.model]}</span></div><div class="clip-notes">${clip.notes}</div><div class="prompt-header"><span class="prompt-label">Prompt</span><button class="edit-btn" onclick="toggleEdit('${clip.id}')">✏️ Edit</button></div><div class="clip-prompt-text" id="pt_${clip.id}">${clip.prompt}</div><textarea class="clip-prompt-edit" id="pe_${clip.id}">${clip.prompt}</textarea>${settingsHtml}${chains}<div class="btn-row"><button class="run-btn ${bc[clip.model]}" id="btn_${clip.id}">${bt}</button></div><div class="rarea" id="ra_${clip.id}"></div>`;
  setTimeout(()=>{document.getElementById('btn_'+clip.id)?.addEventListener('click',()=>runClip(clip));},0);
  return div;
}

window.toggleEdit=function(id){const pt=document.getElementById('pt_'+id);const pe=document.getElementById('pe_'+id);if(pe.style.display==='block'){pt.textContent=pe.value;pt.style.display='block';pe.style.display='none';}else{pe.style.display='block';pt.style.display='none';pe.focus();}};
window.toggleSound=function(id){const el=document.getElementById('snd_'+id);const on=el.classList.toggle('on');el.textContent='🔊 '+(on?'on':'off');};
function getPrompt(id){const pe=document.getElementById('pe_'+id);const pt=document.getElementById('pt_'+id);return pe?.style.display==='block'?pe.value:pt?.textContent||'';}
function getSetting(id,type){return document.getElementById(type+'_'+id)?.value||null;}
function isSoundOn(id){return document.getElementById('snd_'+id)?.classList.contains('on')||false;}
function getAspectClass(ar){if(ar==='16:9')return 'landscape';if(ar==='1:1')return 'square';return '';}
function stat(id,msg,type){document.getElementById('ra_'+id).innerHTML=`<div class="smsg ${type}">${msg}</div>`;}
function showImg(id,url,key,ar){const ac=getAspectClass(ar||'9:16');document.getElementById('ra_'+id).innerHTML=`<div><img class="rimg ${ac}" src="${url}"><div class="result-btns"><button class="pbtn" onclick="saveRef('${key}','${url}',this)">✓ Use as start frame</button><a class="dbtn" href="${url}" target="_blank">⬇ Download</a></div></div>`;if(key)set(key,url);}
function showVid(id,url,ar){const ac=getAspectClass(ar||'9:16');document.getElementById('ra_'+id).innerHTML=`<div><video class="rvid ${ac}" src="${url}" controls loop></video><div class="result-btns"><a class="dbtn" href="${url}" target="_blank">⬇ Download</a></div></div>`;}
window.saveRef=(k,url,btn)=>{set(k,url);btn.textContent='✓ Saved!';};
function getRefs(clip){return clip.refs.map(r=>get(r)).filter(Boolean);}

async function proxyCall(action,payload){
  const res=await fetch(PROXY,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,payload})});
  if(!res.ok)throw new Error('Worker error '+res.status);
  return res.json();
}
async function pollTask(taskId,maxAttempts=60){
  for(let i=0;i<maxAttempts;i++){
    await new Promise(r=>setTimeout(r,5000));
    const data=await proxyCall('get_task',{taskId});
    const state=data?.data?.state;
    if(state==='success'){const result=JSON.parse(data.data.resultJson||'{}');return result.resultUrls?.[0]||null;}
    if(state==='fail')throw new Error('Failed: '+data?.data?.failMsg);
  }
  throw new Error('Timed out');
}
async function runClip(clip){
  const btn=document.getElementById('btn_'+clip.id);
  btn.disabled=true;stat(clip.id,'⏳ Generating…','sl');
  try{
    const refs=getRefs(clip);const prompt=getPrompt(clip.id);
    const ar=getSetting(clip.id,'ar')||clip.aspect||'9:16';
    if(clip.model==='gpt')await runGPT(clip,refs,prompt,ar);
    else await runKling(clip,refs,prompt,ar);
  }catch(e){stat(clip.id,'❌ '+e.message,'se');console.error(e);}
  btn.disabled=false;
}
async function runGPT(clip,refs,prompt,ar){
  stat(clip.id,'⏳ Creating image task…','sl');
  const res=getSetting(clip.id,'res')||'1K';
  const data=await proxyCall('generate_image_gpt',{prompt,aspect_ratio:ar,resolution:res,...(refs.length?{input_urls:refs.slice(0,16)}:{})});
  const taskId=data?.data?.taskId;
  if(!taskId)throw new Error('No task ID: '+JSON.stringify(data));
  stat(clip.id,'⏳ Waiting for image (~30s)…','sl');
  const url=await pollTask(taskId);
  if(url)showImg(clip.id,url,clip.outputKey,ar);
  else throw new Error('No image URL');
}
async function runKling(clip,refs,prompt,ar){
  stat(clip.id,'⏳ Creating video task…','sl');
  const dur=getSetting(clip.id,'dur')||'4';
  const mode=getSetting(clip.id,'mode')||'std';
  const sound=isSoundOn(clip.id);
  const data=await proxyCall('generate_video_kling',{prompt,duration:dur,aspect_ratio:ar,mode,sound,multi_shots:true,multi_prompt:[{duration:parseInt(dur),prompt}],...(refs[0]?{image_urls:[refs[0]]}:{})});
  const taskId=data?.data?.taskId;
  if(!taskId)throw new Error('No task ID: '+JSON.stringify(data));
  stat(clip.id,'⏳ Waiting for video (~2min)…','sl');
  const url=await pollTask(taskId,60);
  if(url)showVid(clip.id,url,ar);
  else throw new Error('No video URL');
}

renderGlobals();
renderPipeline();
</script>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crochet Pipeline</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;600;700;800&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#080808;--surface:#0f0f0f;--surface2:#161616;--border:#1f1f1f;--border2:#2a2a2a;
  --text:#e8e8e8;--muted:#555;--nano:#22c55e;--nano-bg:#0a1f0f;--nano-border:#163520;
  --kling:#a78bfa;--kling-bg:#130d2b;--kling-border:#231545;
  --accent:#f97316;
}
body{font-family:'Syne',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:24px 20px}
.header{margin-bottom:28px}
.header h1{font-size:22px;font-weight:800;letter-spacing:-0.5px;color:#fff}
.header h1 span{color:var(--accent)}
.header p{font-size:12px;color:var(--muted);margin-top:4px;font-family:'DM Mono',monospace}

/* GLOBAL REFS */
.global-refs{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:16px}
.section-title{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin-bottom:12px}
.refs-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.ref-item label.ref-label{font-size:10px;color:var(--muted);display:block;margin-bottom:5px;font-family:'DM Mono',monospace}
.ref-upload{display:flex;flex-direction:column;gap:4px}
.ref-upload-row{display:flex;align-items:center;gap:6px}
.ubtn{font-size:10px;padding:4px 10px;border:1px solid var(--border2);border-radius:5px;background:var(--surface2);color:#aaa;cursor:pointer;white-space:nowrap;font-family:'DM Mono',monospace}
.ubtn:hover{background:#1e1e1e;color:#ddd}
input[type=file]{display:none}
.iprev{width:30px;height:30px;border-radius:4px;object-fit:cover;display:none;border:1px solid var(--border2)}
.iurl{width:100%;font-size:10px;padding:4px 8px;border:1px solid var(--border);border-radius:5px;background:var(--surface2);color:#ccc;outline:none;font-family:'DM Mono',monospace}
.iurl:focus{border-color:var(--border2)}

/* VIDEO CARDS */
.vcard{background:var(--surface);border:1px solid var(--border);border-radius:12px;margin-bottom:10px;overflow:hidden}
.vhead{padding:14px 16px;display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none}
.vhead:hover{background:var(--surface2)}
.vnum{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;background:var(--surface2);color:var(--muted);flex-shrink:0;font-family:'DM Mono',monospace}
.vtitle{flex:1;font-size:13px;font-weight:700;letter-spacing:-0.2px}
.chev{font-size:12px;color:var(--muted);transition:transform .2s}
.chev.o{transform:rotate(180deg)}
.vbody{display:none;border-top:1px solid var(--border)}
.vbody.o{display:block}
.clips{padding:12px;display:flex;flex-direction:column;gap:10px}

/* CLIPS */
.clip{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:12px}
.clip-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.clip-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);flex:1;font-family:'DM Mono',monospace}
.mtag{font-size:9px;padding:2px 8px;border-radius:4px;font-weight:700;letter-spacing:.04em;font-family:'DM Mono',monospace}
.tnano{background:var(--nano-bg);color:var(--nano);border:1px solid var(--nano-border)}
.tkling{background:var(--kling-bg);color:var(--kling);border:1px solid var(--kling-border)}

/* NOTES */
.clip-notes{font-size:10px;color:#444;background:#0a0a0a;border:1px solid var(--border);border-radius:5px;padding:6px 10px;margin-bottom:8px;font-family:'DM Mono',monospace;line-height:1.5}

/* EDITABLE PROMPT */
.prompt-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.prompt-label{font-size:9px;color:var(--muted);font-family:'DM Mono',monospace;text-transform:uppercase;letter-spacing:.08em}
.edit-btn{font-size:9px;padding:2px 8px;border:1px solid var(--border2);border-radius:4px;background:transparent;color:var(--muted);cursor:pointer;font-family:'DM Mono',monospace}
.edit-btn:hover{color:var(--text);border-color:#444}
.clip-prompt-text{font-size:11px;color:#666;line-height:1.55;background:#0a0a0a;border:1px solid var(--border);border-radius:5px;padding:8px 10px;font-family:'DM Mono',monospace;margin-bottom:8px}
.clip-prompt-edit{width:100%;font-size:11px;color:#ccc;line-height:1.55;background:#0a0a0a;border:1px solid var(--kling-border);border-radius:5px;padding:8px 10px;font-family:'DM Mono',monospace;margin-bottom:8px;resize:vertical;min-height:80px;outline:none;display:none}

/* EDITABLE SETTINGS */
.settings-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;align-items:center}
.setting-label{font-size:9px;color:var(--muted);font-family:'DM Mono',monospace;text-transform:uppercase;letter-spacing:.08em;width:100%}
.setting-select{font-size:10px;padding:3px 7px;border:1px solid var(--border2);border-radius:4px;background:var(--surface);color:#aaa;font-family:'DM Mono',monospace;outline:none;cursor:pointer}
.setting-select:focus{border-color:#444}
.setting-toggle{font-size:10px;padding:3px 10px;border:1px solid var(--border2);border-radius:4px;background:var(--surface);color:#aaa;font-family:'DM Mono',monospace;cursor:pointer;user-select:none}
.setting-toggle.on{background:var(--nano-bg);color:var(--nano);border-color:var(--nano-border)}

/* CHAIN */
.chain-row{font-size:10px;color:#2a3a2a;font-style:italic;margin-bottom:8px;font-family:'DM Mono',monospace}

/* BUTTONS */
.btn-row{display:flex;gap:6px;margin-bottom:0}
.run-btn{flex:1;padding:8px;border:none;border-radius:6px;font-size:11px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px;transition:all .15s;font-family:'Syne',sans-serif;letter-spacing:.02em}
.run-btn:disabled{opacity:.35;cursor:not-allowed}
.run-btn.rn{background:var(--nano-bg);color:var(--nano);border:1px solid var(--nano-border)}.run-btn.rn:hover:not(:disabled){background:#112315}
.run-btn.rk{background:var(--kling-bg);color:var(--kling);border:1px solid var(--kling-border)}.run-btn.rk:hover:not(:disabled){background:#1c1040}

/* RESULTS */
.rarea{margin-top:8px}
.smsg{font-size:11px;padding:9px;text-align:center;background:#0a0a0a;border:1px solid var(--border);border-radius:5px;font-family:'DM Mono',monospace}
.sl{color:var(--kling)}.se{color:#f87171}.ss{color:var(--nano)}
.result-wrap{position:relative}
.rimg{width:100%;border-radius:6px;display:block;border:1px solid var(--border);margin-bottom:6px}
.rvid{width:100%;border-radius:6px;display:block;border:1px solid var(--border);margin-bottom:6px}
.result-btns{display:flex;gap:6px}
.pbtn{flex:1;padding:5px;border:1px solid var(--nano-border);border-radius:5px;background:transparent;color:var(--nano);font-size:10px;cursor:pointer;font-family:'DM Mono',monospace}
.pbtn:hover{background:var(--nano-bg)}
.dbtn{flex:1;padding:5px;border:1px solid var(--border2);border-radius:5px;background:transparent;color:#888;font-size:10px;cursor:pointer;font-family:'DM Mono',monospace}
.dbtn:hover{background:var(--surface2);color:#ccc}
</style>
</head>
<body>

<div class="header">
  <h1>🌸 Crochet <span>Pipeline</span></h1>
  <p>nano banana 2 → kling 3.0 // organic dropshipping — v2</p>
</div>

<div class="global-refs">
  <div class="section-title">Global References — upload once, used everywhere</div>
  <div class="refs-grid" id="grefgrid"></div>
</div>

<div id="pipeline"></div>

<script>
const PROXY = 'https://crochet-proxy.kalenrattt.workers.dev/';

const STORE = {
  girl: 'https://i.ibb.co/hx9BWcYk/b8c6e5d1a850216f407402376a826deb.jpg',
  stall: 'https://i.ibb.co/QFy18YnS/Stallphoto1.jpg',
  bouquet: 'https://i.ibb.co/mrhVYM0q/Boquet.jpg',
  garage: 'https://i.ibb.co/XfB0LL4D/83b912ea00c0113ad43d6ecc077330fc-1780564197-fastag2a.jpg',
  dye: 'https://i.ibb.co/1JpttZCj/Young-girl-dipping-yarn.jpg',
  dad: 'https://i.ibb.co/4nTjC2W4/1.jpg'
};
const get = k => STORE[k]||null;
const set = (k,v) => { STORE[k]=v; };

const GLOBALS = [
  {key:'girl', label:'Girl ref'},
  {key:'stall', label:'Stall ref'},
  {key:'bouquet', label:'Bouquet ref'},
  {key:'garage', label:'Garage studio ref'},
  {key:'dye', label:'Dye ref'},
  {key:'dad', label:'Dad ref'}
];

const VIDEOS = [
  {
    id:'v1', title:'Video 1 — Dad Hook + Full Video',
    clips:[
      {
        id:'v1c1', label:'Clip 1 — Dad + Girl Hook Image', model:'nano', type:'image', outputKey:'v1c1_img',
        refs:['girl','bouquet','garage','dad'],
        notes:'👗 Outfit: adidas top, no apron | 📍 Setting: garage studio at table | 🎬 Freeze frame, candid',
        prompt:'The girl from ref 1 and the man from ref 4 are sitting together at a table in a garage studio like ref 3. The girl looks exactly like ref 1 — curly dark hair, gold necklace, adidas top. The man looks like ref 4 — short grey-brown hair, stubble, white t-shirt, her dad. She is crocheting blue flowers from ref 2 as the dad sits next to her with a concerned look, about to say something. Freeze frame from a candid iPhone 12 video. Natural indoor lighting. No UI, no grain, no colour grading.',
        aspect:'9:16', resolution:'2K'
      },
      {
        id:'v1c2', label:'Clip 1 — Dad Hook Video', model:'kling', type:'video',
        refs:['v1c1_img'],
        notes:'🎬 Hook video — dad delivers the line',
        prompt:'The dad gently turns to his daughter and says "Nobody is going to buy your crochet flowers honey, I\'m sorry." She slows down her crocheting, her expression drops slightly. Camera mostly still, subtle natural movement. Natural indoor lighting. No UI. Raw iPhone footage feel.',
        aspect:'9:16', duration:'4', mode:'std', sound:true
      },
      {
        id:'v1c3', label:'Clip 2 — Crocheting B-Roll Image', model:'nano', type:'image', outputKey:'v1c3_img',
        refs:['girl','garage','bouquet'],
        notes:'👗 Outfit: adidas top WITH apron over it | 📍 Setting: garage studio, different angle to clip 1 | 🎬 Behind shoulder angle',
        prompt:'The girl from ref 1 is sitting alone in her garage studio like ref 2 crocheting a blue flower like ref 3. She is wearing an adidas top with a craft apron over it. She looks exactly like ref 1 — curly dark hair, gold necklace. She is focused and calm, eyes glued to her work, does not know she is being filmed. Angle from slightly behind her shoulder. Natural indoor lighting. Freeze frame from a candid iPhone video. No UI, no grain, no colour grading.',
        aspect:'9:16', resolution:'2K'
      },
      {
        id:'v1c4', label:'Clip 2 — Crocheting B-Roll Video', model:'kling', type:'video',
        refs:['v1c3_img'],
        notes:'🎬 Stable camera, she does not look up',
        prompt:'The girl is crocheting a blue flower, focused and calm, wearing an apron over her adidas top. Does not know she is being filmed. Eyes glued to her work. Slow deliberate movements, taking her time. Fixed stable camera, no zoom, no movement. Natural indoor lighting. No UI.',
        aspect:'16:9', duration:'4', mode:'std', sound:false
      },
      {
        id:'v1c5', label:'Clip 3 — Assembly B-Roll Image', model:'nano', type:'image', outputKey:'v1c5_img',
        refs:['girl','garage','bouquet'],
        notes:'👗 Outfit: same apron over adidas | 📍 Setting: garage studio, different angle | 🎬 Hot gluing stems',
        prompt:'The girl from ref 1 is in her garage studio like ref 2 assembling a blue crochet flower bouquet like ref 3. She is wearing an adidas top with a craft apron over it. She is carefully hot gluing the stems together with a glue gun to form the bouquet. Focused and precise, slow movements. Angle slightly in front of her. Natural indoor lighting. Freeze frame from a candid iPhone video. No UI, no grain, no colour grading.',
        aspect:'9:16', resolution:'2K'
      },
      {
        id:'v1c6', label:'Clip 3 — Assembly B-Roll Video', model:'kling', type:'video',
        refs:['v1c5_img'],
        notes:'🎬 Slow and precise, glue gun in hand',
        prompt:'The girl is carefully hot gluing crochet flower stems together one by one to form a bouquet, wearing an apron over her adidas top. Slow and precise movements. She does not know she is being filmed. Fixed stable camera. Natural indoor lighting. No UI.',
        aspect:'16:9', duration:'4', mode:'std', sound:false
      },
      {
        id:'v1c7', label:'Clip 4 — Product Beauty Shot Image', model:'nano', type:'image', outputKey:'v1c7_img',
        refs:['bouquet'],
        notes:'📍 No girl — just the bouquet | 🎬 Nice table, warm lighting, beauty shot',
        prompt:'A beautiful blue crochet flower bouquet like ref 1 sitting on a clean white or light wooden table. Warm soft lighting illuminating the flowers from the side. Clean minimal background. Close up beauty shot, like a product photo. The bouquet is the hero — showcasing the blue yarn roses and small flowers wrapped neatly. No people. No UI, no grain, no colour grading. Elegant and clean.',
        aspect:'9:16', resolution:'2K'
      },
      {
        id:'v1c8', label:'Clip 4 — Product Beauty Shot Video', model:'kling', type:'video',
        refs:['v1c7_img'],
        notes:'🎬 Slow gentle push in or orbit around the bouquet',
        prompt:'A beautiful blue crochet flower bouquet sitting on a clean table with warm soft lighting. Very slow gentle camera movement, almost imperceptible. The bouquet is the hero. Clean minimal background. No people. No UI.',
        aspect:'9:16', duration:'4', mode:'std', sound:false
      }
    ]
  }
];

function toB64(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file);});}

function renderGlobals(){
  const grid=document.getElementById('grefgrid');
  GLOBALS.forEach(g=>{
    const d=document.createElement('div');
    d.innerHTML=`
      <label class="ref-label">${g.label}</label>
      <div class="ref-upload">
        <div class="ref-upload-row">
          <label class="ubtn" for="gf_${g.key}">📎 Upload</label>
          <input type="file" id="gf_${g.key}" accept="image/*">
          <img class="iprev" id="gp_${g.key}" src="${get(g.key)||''}" style="${get(g.key)?'display:block':''}">
        </div>
        <input type="text" class="iurl" id="gu_${g.key}" placeholder="or paste URL" value="${get(g.key)||''}">
      </div>`;
    grid.appendChild(d);
    setTimeout(()=>{
      document.getElementById('gf_'+g.key).addEventListener('change',async e=>{
        const f=e.target.files[0];if(!f)return;
        const b=await toB64(f);set(g.key,b);
        const p=document.getElementById('gp_'+g.key);p.src=b;p.style.display='block';
      });
      document.getElementById('gu_'+g.key).addEventListener('blur',e=>{
        const v=e.target.value.trim();if(v){set(g.key,v);const p=document.getElementById('gp_'+g.key);p.src=v;p.style.display='block';}
      });
    },0);
  });
}

function renderPipeline(){
  const cont=document.getElementById('pipeline');
  VIDEOS.forEach((vid,vi)=>{
    const card=document.createElement('div');card.className='vcard';
    const head=document.createElement('div');head.className='vhead';
    head.innerHTML=`<div class="vnum">${vi+1}</div><div class="vtitle">${vid.title}</div><div class="chev" id="ch_${vid.id}">▾</div>`;
    const body=document.createElement('div');body.className='vbody'+(vi===0?' o':'');body.id='vb_'+vid.id;
    const clips=document.createElement('div');clips.className='clips';
    vid.clips.forEach(c=>clips.appendChild(buildClip(c)));
    body.appendChild(clips);card.appendChild(head);card.appendChild(body);
    cont.appendChild(card);
    head.addEventListener('click',()=>{
      body.classList.toggle('o');
      document.getElementById('ch_'+vid.id).classList.toggle('o',body.classList.contains('o'));
    });
  });
}

function buildClip(clip){
  const div=document.createElement('div');div.className='clip';
  const mc={nano:'tnano',kling:'tkling'};
  const ml={nano:'Nano Banana 2',kling:'Kling 3.0'};
  const bc={nano:'rn',kling:'rk'};
  const bt=clip.type==='image'?'🖼 Generate Image':'🎬 Generate Video';
  const chains=clip.refs.filter(r=>r.includes('_img')).map(r=>`<div class="chain-row">↳ uses ${r} from previous step</div>`).join('');

  // Settings HTML
  let settingsHtml = '';
  if(clip.type==='image'){
    settingsHtml=`
      <div class="settings-row">
        <span class="setting-label">Settings</span>
        <select class="setting-select" id="res_${clip.id}">
          <option value="1K">1K</option>
          <option value="2K" selected>2K</option>
          <option value="4K">4K</option>
        </select>
        <select class="setting-select" id="ar_${clip.id}">
          <option value="9:16" ${clip.aspect==='9:16'?'selected':''}>9:16</option>
          <option value="16:9" ${clip.aspect==='16:9'?'selected':''}>16:9</option>
          <option value="1:1">1:1</option>
        </select>
      </div>`;
  } else {
    settingsHtml=`
      <div class="settings-row">
        <span class="setting-label">Settings</span>
        <select class="setting-select" id="dur_${clip.id}">
          <option value="3">3s</option>
          <option value="4" selected>4s</option>
          <option value="5">5s</option>
          <option value="6">6s</option>
        </select>
        <select class="setting-select" id="ar_${clip.id}">
          <option value="9:16" ${clip.aspect==='9:16'?'selected':''}>9:16</option>
          <option value="16:9" ${clip.aspect==='16:9'?'selected':''}>16:9</option>
          <option value="1:1">1:1</option>
        </select>
        <select class="setting-select" id="mode_${clip.id}">
          <option value="std" selected>std</option>
          <option value="pro">pro</option>
        </select>
        <span class="setting-toggle ${clip.sound?'on':''}" id="snd_${clip.id}" onclick="toggleSound('${clip.id}')">🔊 sound ${clip.sound?'on':'off'}</span>
      </div>`;
  }

  div.innerHTML=`
    <div class="clip-head"><span class="clip-label">${clip.label}</span><span class="mtag ${mc[clip.model]}">${ml[clip.model]}</span></div>
    <div class="clip-notes">${clip.notes}</div>
    <div class="prompt-header"><span class="prompt-label">Prompt</span><button class="edit-btn" onclick="toggleEdit('${clip.id}')">✏️ Edit</button></div>
    <div class="clip-prompt-text" id="pt_${clip.id}">${clip.prompt}</div>
    <textarea class="clip-prompt-edit" id="pe_${clip.id}">${clip.prompt}</textarea>
    ${settingsHtml}
    ${chains}
    <div class="btn-row">
      <button class="run-btn ${bc[clip.model]}" id="btn_${clip.id}">${bt}</button>
    </div>
    <div class="rarea" id="ra_${clip.id}"></div>`;

  setTimeout(()=>{
    document.getElementById('btn_'+clip.id)?.addEventListener('click',()=>runClip(clip));
  },0);
  return div;
}

window.toggleEdit = function(id){
  const pt=document.getElementById('pt_'+id);
  const pe=document.getElementById('pe_'+id);
  const showing=pe.style.display==='block';
  if(showing){
    pt.textContent=pe.value;
    pt.style.display='block';
    pe.style.display='none';
  } else {
    pe.style.display='block';
    pt.style.display='none';
    pe.focus();
  }
};

window.toggleSound = function(id){
  const el=document.getElementById('snd_'+id);
  const on=el.classList.toggle('on');
  el.textContent='🔊 sound '+(on?'on':'off');
};

function getPrompt(id){
  const pe=document.getElementById('pe_'+id);
  const pt=document.getElementById('pt_'+id);
  return pe?.style.display==='block' ? pe.value : pt?.textContent || '';
}

function getSetting(id, type){
  const el=document.getElementById(type+'_'+id);
  return el?.value||null;
}

function isSoundOn(id){
  return document.getElementById('snd_'+id)?.classList.contains('on')||false;
}

function stat(id,msg,type){document.getElementById('ra_'+id).innerHTML=`<div class="smsg ${type}">${msg}</div>`;}

function showImg(id,url,key){
  document.getElementById('ra_'+id).innerHTML=`
    <div class="result-wrap">
      <img class="rimg" src="${url}">
      <div class="result-btns">
        <button class="pbtn" onclick="saveRef('${key}','${url}',this)">✓ Use as start frame</button>
        <a class="dbtn" href="${url}" download target="_blank">⬇ Download</a>
      </div>
    </div>`;
  if(key) set(key,url);
}

function showVid(id,url){
  document.getElementById('ra_'+id).innerHTML=`
    <div class="result-wrap">
      <video class="rvid" src="${url}" controls loop></video>
      <div class="result-btns">
        <a class="dbtn" href="${url}" download target="_blank">⬇ Download</a>
      </div>
    </div>`;
}

window.saveRef=(k,url,btn)=>{set(k,url);btn.textContent='✓ Saved!';};
function getRefs(clip){return clip.refs.map(r=>get(r)).filter(Boolean);}

async function proxyCall(action, payload){
  const res=await fetch(PROXY,{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({action,payload})
  });
  if(!res.ok) throw new Error('Worker error '+res.status);
  return res.json();
}

async function pollTask(taskId,maxAttempts=60){
  for(let i=0;i<maxAttempts;i++){
    await new Promise(r=>setTimeout(r,5000));
    const data=await proxyCall('get_task',{taskId});
    const state=data?.data?.state;
    if(state==='success'){
      const result=JSON.parse(data.data.resultJson||'{}');
      return result.resultUrls?.[0]||null;
    }
    if(state==='fail') throw new Error('Failed: '+data?.data?.failMsg);
  }
  throw new Error('Timed out');
}

async function runClip(clip){
  const btn=document.getElementById('btn_'+clip.id);
  btn.disabled=true;
  stat(clip.id,'⏳ Generating…','sl');
  try{
    const refs=getRefs(clip);
    const prompt=getPrompt(clip.id);
    if(clip.model==='nano') await runNano(clip,refs,prompt);
    else await runKling(clip,refs,prompt);
  }catch(e){stat(clip.id,'❌ '+e.message,'se');console.error(e);}
  btn.disabled=false;
}

async function runNano(clip,refs,prompt){
  stat(clip.id,'⏳ Creating image task…','sl');
  const res=getSetting(clip.id,'res')||'2K';
  const ar=getSetting(clip.id,'ar')||'9:16';
  const data=await proxyCall('generate_image',{
    prompt,aspect_ratio:ar,resolution:res,
    ...(refs.length?{image_input:refs.slice(0,5)}:{})
  });
  const taskId=data?.data?.taskId;
  if(!taskId) throw new Error('No task ID: '+JSON.stringify(data));
  stat(clip.id,'⏳ Waiting for image (~30s)…','sl');
  const url=await pollTask(taskId);
  if(url) showImg(clip.id,url,clip.outputKey);
  else throw new Error('No image URL');
}

async function runKling(clip,refs,prompt){
  stat(clip.id,'⏳ Creating video task…','sl');
  const dur=getSetting(clip.id,'dur')||'4';
  const ar=getSetting(clip.id,'ar')||'9:16';
  const mode=getSetting(clip.id,'mode')||'std';
  const sound=isSoundOn(clip.id);
  const data=await proxyCall('generate_video_kling',{
    prompt,duration:dur,aspect_ratio:ar,mode,sound,
    multi_shots:true,
    multi_prompt:[{duration:parseInt(dur),prompt}],
    ...(refs[0]?{image_urls:[refs[0]]}:{})
  });
  const taskId=data?.data?.taskId;
  if(!taskId) throw new Error('No task ID: '+JSON.stringify(data));
  stat(clip.id,'⏳ Waiting for video (~2min)…','sl');
  const url=await pollTask(taskId,60);
  if(url) showVid(clip.id,url);
  else throw new Error('No video URL');
}

renderGlobals();
renderPipeline();
</script>

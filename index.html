<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Drive-By Egg Hook</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;600;700;800&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#080808;--surface:#0f0f0f;--surface2:#161616;--border:#1f1f1f;--border2:#2a2a2a;
  --text:#e8e8e8;--muted:#555;
  --gpt:#f59e0b;--gpt-bg:#1c1200;--gpt-border:#2e1f00;
  --kling:#a78bfa;--kling-bg:#130d2b;--kling-border:#231545;
  --accent:#f97316;
}
body{font-family:'Syne',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:20px 16px}
.header{margin-bottom:24px}
.header h1{font-size:20px;font-weight:800;letter-spacing:-0.5px;color:#fff}
.header h1 span{color:var(--accent)}
.header p{font-size:11px;color:var(--muted);margin-top:3px;font-family:'DM Mono',monospace}
.global-refs{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:14px}
.section-title{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin-bottom:10px}
.refs-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ref-label{font-size:10px;color:var(--muted);display:block;margin-bottom:4px;font-family:'DM Mono',monospace}
.ref-upload{display:flex;flex-direction:column;gap:3px}
.ref-upload-row{display:flex;align-items:center;gap:5px}
.ubtn{font-size:10px;padding:3px 9px;border:1px solid var(--border2);border-radius:5px;background:var(--surface2);color:#aaa;cursor:pointer;white-space:nowrap;font-family:'DM Mono',monospace}
.ubtn:hover{background:#1e1e1e;color:#ddd}
input[type=file]{display:none}
.iprev{width:26px;height:26px;border-radius:3px;object-fit:cover;display:none;border:1px solid var(--border2)}
.iurl{width:100%;font-size:10px;padding:3px 7px;border:1px solid var(--border);border-radius:5px;background:var(--surface2);color:#ccc;outline:none;font-family:'DM Mono',monospace}
.iurl:focus{border-color:var(--border2)}
.vcard{background:var(--surface);border:1px solid var(--border);border-radius:12px;margin-bottom:10px;overflow:hidden}
.vhead{padding:12px 14px;display:flex;align-items:center;gap:10px}
.vnum{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;background:var(--surface2);color:var(--muted);flex-shrink:0;font-family:'DM Mono',monospace}
.vtitle{flex:1;font-size:13px;font-weight:700;letter-spacing:-0.2px}
.clips{padding:10px;display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--border)}
.clip{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:11px}
.clip-head{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.clip-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);flex:1;font-family:'DM Mono',monospace}
.mtag{font-size:9px;padding:2px 7px;border-radius:4px;font-weight:700;font-family:'DM Mono',monospace}
.tgpt{background:var(--gpt-bg);color:var(--gpt);border:1px solid var(--gpt-border)}
.tkling{background:var(--kling-bg);color:var(--kling);border:1px solid var(--kling-border)}
.clip-notes{font-size:10px;color:#3a3a3a;background:#0a0a0a;border:1px solid var(--border);border-radius:5px;padding:5px 9px;margin-bottom:7px;font-family:'DM Mono',monospace;line-height:1.5}
.prompt-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:3px}
.prompt-label{font-size:9px;color:var(--muted);font-family:'DM Mono',monospace;text-transform:uppercase;letter-spacing:.08em}
.edit-btn{font-size:9px;padding:2px 7px;border:1px solid var(--border2);border-radius:4px;background:transparent;color:var(--muted);cursor:pointer;font-family:'DM Mono',monospace}
.edit-btn:hover{color:var(--text);border-color:#444}
.clip-prompt-text{font-size:11px;color:#555;line-height:1.5;background:#0a0a0a;border:1px solid var(--border);border-radius:5px;padding:7px 9px;font-family:'DM Mono',monospace;margin-bottom:7px}
.clip-prompt-edit{width:100%;font-size:11px;color:#ccc;line-height:1.5;background:#0a0a0a;border:1px solid var(--kling-border);border-radius:5px;padding:7px 9px;font-family:'DM Mono',monospace;margin-bottom:7px;resize:vertical;min-height:90px;outline:none;display:none}
.settings-row{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px;align-items:center}
.setting-select{font-size:10px;padding:3px 7px;border:1px solid var(--border2);border-radius:4px;background:var(--surface);color:#aaa;font-family:'DM Mono',monospace;outline:none;cursor:pointer}
.setting-toggle{font-size:10px;padding:3px 9px;border:1px solid var(--border2);border-radius:4px;background:var(--surface);color:#aaa;font-family:'DM Mono',monospace;cursor:pointer;user-select:none}
.setting-toggle.on{background:#071825;color:#38bdf8;border-color:#0e2d42}
.chain-row{font-size:10px;color:#252525;font-style:italic;margin-bottom:7px;font-family:'DM Mono',monospace}
.btn-row{display:flex;gap:6px}
.run-btn{flex:1;padding:8px;border:none;border-radius:6px;font-size:11px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px;transition:all .15s;font-family:'Syne',sans-serif}
.run-btn:disabled{opacity:.35;cursor:not-allowed}
.run-btn.rfull{background:var(--accent);color:#fff;border:none}
.run-btn.rfull:hover:not(:disabled){background:#ea670c}
.run-btn.rg{background:var(--gpt-bg);color:var(--gpt);border:1px solid var(--gpt-border)}.run-btn.rg:hover:not(:disabled){background:#261a00}
.run-btn.rk{background:var(--kling-bg);color:var(--kling);border:1px solid var(--kling-border)}.run-btn.rk:hover:not(:disabled){background:#1c1040}
.rarea{margin-top:7px}
.smsg{font-size:11px;padding:8px;text-align:center;background:#0a0a0a;border:1px solid var(--border);border-radius:5px;font-family:'DM Mono',monospace}
.sl{color:var(--kling)}.se{color:#f87171}.ss{color:var(--gpt)}
.rimg{width:100%;max-height:300px;object-fit:cover;border-radius:6px;display:block;border:1px solid var(--border);margin-bottom:5px}
.rvid{width:100%;max-height:340px;border-radius:6px;display:block;border:1px solid var(--border);margin-bottom:5px}
.result-btns{display:flex;gap:5px}
.dbtn{flex:1;padding:6px;border:1px solid var(--border2);border-radius:5px;background:transparent;color:#888;font-size:10px;font-family:'DM Mono',monospace;text-align:center;text-decoration:none;display:block}
.dbtn:hover{background:var(--surface2);color:#ccc}
</style>
</head>
<body>
<div class="header">
  <h1>🥚 Drive-By <span>Egg</span> Hook</h1>
  <p>one tap: image → video // standalone hook</p>
</div>

<div class="global-refs">
  <div class="section-title">Global References</div>
  <div class="refs-grid" id="grefgrid"></div>
</div>

<div id="pipeline"></div>

<script>
const PROXY = 'https://crochet-proxy.kalenrattt.workers.dev/';

const STORE = {
  girl: 'https://i.ibb.co/hx9BWcYk/b8c6e5d1a850216f407402376a826deb.jpg',
  car_stall: 'https://i.ibb.co/4RgcSNsf/CAR-STALL-PHOTO.jpg',
  blue_bouquet: 'https://i.ibb.co/QvyqVxPj/Blue.jpg',
  pink_bouquet: 'https://i.ibb.co/0RSL2JZ5/Pink.jpg',
  yellow_bouquet: 'https://i.ibb.co/k6g4MLJk/Yellow.jpg'
};
const get = k => STORE[k]||null;
const set = (k,v) => { STORE[k]=v; };

const GLOBALS = [
  {key:'girl',label:'Girl ref'},{key:'car_stall',label:'Car stall ref'},
  {key:'blue_bouquet',label:'Blue bouquet'},{key:'pink_bouquet',label:'Pink bouquet'},
  {key:'yellow_bouquet',label:'Yellow bouquet'}
];

const HOOKS = [
  {
    id:'h1', title:'Drive-By Egg',
    img:{
      id:'h1img', refs:['girl','car_stall','blue_bouquet','pink_bouquet','yellow_bouquet'],
      prompt:'First person POV filmed from inside a car through the open window on an iPhone. The car door and window frame are clearly visible on the left edge. A young woman with curly dark hair, gold necklace, casual outfit is standing upright behind her outdoor market stall about 3-4 metres away. Her table is filled with blue, pink and yellow crochet flower bouquets neatly displayed. She is looking towards the camera, head straight. Sunny outdoor market, natural daylight. Raw iPhone footage feel. No UI, no grain, no colour grading. iPhone 14 quality.',
      aspect:'9:16', resolution:'1K'
    },
    vid:{
      id:'h1vid', dur:'4', sound:true,
      prompt:'A young man is filming the girl at her crochet flower stall from inside his car — we are his camera POV the entire time. He says you make these yourself? Put that effort into the gym. The girl does not reply. He immediately throws an egg at her face through the window, it hits her directly, egg breaks on impact. She stands there shocked. Camera mostly stable. Raw iPhone footage. Natural daylight. No UI. iPhone 14 quality.'
    }
  }
];

function toB64(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file);});}

function renderGlobals(){
  const grid=document.getElementById('grefgrid');
  GLOBALS.forEach(g=>{
    const d=document.createElement('div');
    d.innerHTML=`<label class="ref-label">${g.label}</label><div class="ref-upload"><div class="ref-upload-row"><label class="ubtn" for="gf_${g.key}">📎</label><input type="file" id="gf_${g.key}" accept="image/*"><img class="iprev" id="gp_${g.key}" src="${get(g.key)||''}" style="${get(g.key)?'display:block':''}"></div><input type="text" class="iurl" id="gu_${g.key}" placeholder="paste URL" value="${get(g.key)||''}"></div>`;
    grid.appendChild(d);
    setTimeout(()=>{
      document.getElementById('gf_'+g.key).addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;const b=await toB64(f);set(g.key,b);const p=document.getElementById('gp_'+g.key);p.src=b;p.style.display='block';});
      document.getElementById('gu_'+g.key).addEventListener('blur',e=>{const v=e.target.value.trim();if(v){set(g.key,v);const p=document.getElementById('gp_'+g.key);p.src=v;p.style.display='block';}});
    },0);
  });
}

function renderPipeline(){
  const cont=document.getElementById('pipeline');
  HOOKS.forEach((hook,hi)=>{
    const card=document.createElement('div');card.className='vcard';
    const head=document.createElement('div');head.className='vhead';
    head.innerHTML=`<div class="vnum">${hi+1}</div><div class="vtitle">${hook.title}</div>`;
    const clips=document.createElement('div');clips.className='clips';
    const fullBtnWrap=document.createElement('div');
    fullBtnWrap.innerHTML=`<button class="run-btn rfull" id="full_${hook.id}">⚡ Generate Full Hook (image → video)</button><div class="rarea" id="fullra_${hook.id}"></div>`;
    clips.appendChild(fullBtnWrap);
    clips.appendChild(buildImgClip(hook));
    clips.appendChild(buildVidClip(hook));
    card.appendChild(head);card.appendChild(clips);cont.appendChild(card);
    setTimeout(()=>{document.getElementById('full_'+hook.id)?.addEventListener('click',()=>runFull(hook));},0);
  });
}

function buildImgClip(hook){
  const c=hook.img;
  const div=document.createElement('div');div.className='clip';
  div.innerHTML=`<div class="clip-head"><span class="clip-label">Step 1 — Hook Image</span><span class="mtag tgpt">GPT Image 2</span></div><div class="clip-notes">car POV, all 3 bouquets out, she's 3-4m back</div><div class="prompt-header"><span class="prompt-label">Prompt</span><button class="edit-btn" onclick="toggleEdit('${c.id}')">✏️ Edit</button></div><div class="clip-prompt-text" id="pt_${c.id}">${c.prompt}</div><textarea class="clip-prompt-edit" id="pe_${c.id}">${c.prompt}</textarea><div class="settings-row"><select class="setting-select" id="res_${c.id}"><option value="1K" selected>1K</option><option value="2K">2K</option></select><select class="setting-select" id="ar_${c.id}"><option value="9:16" selected>9:16</option><option value="16:9">16:9</option></select></div><div class="btn-row"><button class="run-btn rg" id="btn_${c.id}">🖼 Generate Image</button></div><div class="rarea" id="ra_${c.id}"></div>`;
  setTimeout(()=>{document.getElementById('btn_'+c.id)?.addEventListener('click',()=>runImg(hook));},0);
  return div;
}

function buildVidClip(hook){
  const c=hook.vid;
  const div=document.createElement('div');div.className='clip';
  div.innerHTML=`<div class="clip-head"><span class="clip-label">Step 2 — Hook Video</span><span class="mtag tkling">Kling 3.0</span></div><div class="chain-row">↳ uses the image from step 1</div><div class="prompt-header"><span class="prompt-label">Prompt</span><button class="edit-btn" onclick="toggleEdit('${c.id}')">✏️ Edit</button></div><div class="clip-prompt-text" id="pt_${c.id}">${c.prompt}</div><textarea class="clip-prompt-edit" id="pe_${c.id}">${c.prompt}</textarea><div class="settings-row"><select class="setting-select" id="dur_${c.id}"><option value="3" ${c.dur==='3'?'selected':''}>3s</option><option value="4" ${c.dur==='4'?'selected':''}>4s</option><option value="5" ${c.dur==='5'?'selected':''}>5s</option></select><select class="setting-select" id="ar_${c.id}"><option value="9:16" selected>9:16</option><option value="16:9">16:9</option></select><select class="setting-select" id="mode_${c.id}"><option value="std">std</option><option value="pro">pro</option></select><span class="setting-toggle ${c.sound?'on':''}" id="snd_${c.id}" onclick="toggleSound('${c.id}')">🔊 ${c.sound?'on':'off'}</span></div><div class="btn-row"><button class="run-btn rk" id="btn_${c.id}">🎬 Generate Video</button></div><div class="rarea" id="ra_${c.id}"></div>`;
  setTimeout(()=>{document.getElementById('btn_'+c.id)?.addEventListener('click',()=>runVid(hook));},0);
  return div;
}

window.toggleEdit=function(id){const pt=document.getElementById('pt_'+id);const pe=document.getElementById('pe_'+id);if(pe.style.display==='block'){pt.textContent=pe.value;pt.style.display='block';pe.style.display='none';}else{pe.style.display='block';pt.style.display='none';pe.focus();}};
window.toggleSound=function(id){const el=document.getElementById('snd_'+id);const on=el.classList.toggle('on');el.textContent='🔊 '+(on?'on':'off');};
function getPrompt(id){const pe=document.getElementById('pe_'+id);const pt=document.getElementById('pt_'+id);return pe?.style.display==='block'?pe.value:pt?.textContent||'';}
function getSetting(id,type){return document.getElementById(type+'_'+id)?.value||null;}
function isSoundOn(id){return document.getElementById('snd_'+id)?.classList.contains('on')||false;}
function stat(id,msg,type){const el=document.getElementById('ra_'+id);if(el)el.innerHTML=`<div class="smsg ${type}">${msg}</div>`;}
function statFull(id,msg,type){const el=document.getElementById('fullra_'+id);if(el)el.innerHTML=`<div class="smsg ${type}">${msg}</div>`;}
function showImg(id,url){document.getElementById('ra_'+id).innerHTML=`<div><img class="rimg" src="${url}"><div class="result-btns"><a class="dbtn" href="${url}" target="_blank">⬇ Download / Open</a></div></div>`;}
function showVid(id,url){document.getElementById('ra_'+id).innerHTML=`<div><video class="rvid" src="${url}" controls loop playsinline></video><div class="result-btns"><a class="dbtn" href="${url}" target="_blank">⬇ Download / Open</a></div></div>`;}
function getRefs(refKeys){return refKeys.map(r=>get(r)).filter(Boolean);}

async function proxyCall(action,payload){
  const res=await fetch(PROXY,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,payload})});
  if(!res.ok)throw new Error('Worker error '+res.status);
  return res.json();
}
async function pollTask(taskId,maxAttempts=80){
  for(let i=0;i<maxAttempts;i++){
    await new Promise(r=>setTimeout(r,5000));
    const data=await proxyCall('get_task',{taskId});
    const state=data?.data?.state;
    if(state==='success'){const result=JSON.parse(data.data.resultJson||'{}');return result.resultUrls?.[0]||null;}
    if(state==='fail')throw new Error('Failed: '+(data?.data?.failMsg||'unknown'));
  }
  throw new Error('Timed out');
}
async function genImage(hook){
  const c=hook.img;
  const refs=getRefs(c.refs);
  const prompt=getPrompt(c.id);
  const ar=getSetting(c.id,'ar')||'9:16';
  const res=getSetting(c.id,'res')||'1K';
  const data=await proxyCall('generate_image_gpt',{prompt,aspect_ratio:ar,resolution:res,...(refs.length?{input_urls:refs.slice(0,16)}:{})});
  const taskId=data?.data?.taskId;
  if(!taskId)throw new Error('No task ID: '+JSON.stringify(data));
  return await pollTask(taskId);
}
async function genVideo(hook,imgUrl){
  const c=hook.vid;
  const prompt=getPrompt(c.id);
  const ar=getSetting(c.id,'ar')||'9:16';
  const dur=getSetting(c.id,'dur')||'4';
  const mode=getSetting(c.id,'mode')||'std';
  const sound=isSoundOn(c.id);
  const data=await proxyCall('generate_video_kling',{prompt,duration:dur,aspect_ratio:ar,mode,sound,multi_shots:true,multi_prompt:[{duration:parseInt(dur),prompt}],...(imgUrl?{image_urls:[imgUrl]}:{})});
  const taskId=data?.data?.taskId;
  if(!taskId)throw new Error('No task ID: '+JSON.stringify(data));
  return await pollTask(taskId);
}
async function runImg(hook){
  const btn=document.getElementById('btn_'+hook.img.id);btn.disabled=true;
  stat(hook.img.id,'⏳ Creating image (~30s)…','sl');
  try{const url=await genImage(hook);if(url){showImg(hook.img.id,url);hook._imgUrl=url;}else throw new Error('No image URL');}
  catch(e){stat(hook.img.id,'❌ '+e.message,'se');}
  btn.disabled=false;
}
async function runVid(hook){
  const btn=document.getElementById('btn_'+hook.vid.id);btn.disabled=true;
  const imgUrl=hook._imgUrl;
  if(!imgUrl){stat(hook.vid.id,'❌ Generate the image first','se');btn.disabled=false;return;}
  stat(hook.vid.id,'⏳ Creating video (~2min)…','sl');
  try{const url=await genVideo(hook,imgUrl);if(url)showVid(hook.vid.id,url);else throw new Error('No video URL');}
  catch(e){stat(hook.vid.id,'❌ '+e.message,'se');}
  btn.disabled=false;
}
async function runFull(hook){
  const fb=document.getElementById('full_'+hook.id);fb.disabled=true;
  statFull(hook.id,'⏳ Step 1: generating image…','sl');
  try{
    const imgUrl=await genImage(hook);
    if(!imgUrl)throw new Error('Image failed');
    showImg(hook.img.id,imgUrl);hook._imgUrl=imgUrl;
    statFull(hook.id,'✅ Image done. ⏳ Step 2: generating video…','sl');
    const vidUrl=await genVideo(hook,imgUrl);
    if(!vidUrl)throw new Error('Video failed');
    showVid(hook.vid.id,vidUrl);
    statFull(hook.id,'✅ Hook complete! Download below.','ss');
  }catch(e){statFull(hook.id,'❌ '+e.message,'se');}
  fb.disabled=false;
}

renderGlobals();
renderPipeline();
</script>
</body>
</html>

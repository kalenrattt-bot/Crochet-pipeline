<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crochet Pipeline</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;600;700;800&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#080808;--surface:#0f0f0f;--surface2:#161616;--border:#1f1f1f;--border2:#2a2a2a;
  --text:#e8e8e8;--muted:#555;--nano:#22c55e;--nano-bg:#0a1f0f;--nano-border:#163520;
  --kling:#a78bfa;--kling-bg:#130d2b;--kling-border:#231545;
  --seed:#38bdf8;--seed-bg:#071825;--seed-border:#0e2d42;
  --accent:#f97316;
}
body{font-family:'Syne',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:24px 20px}
.header{margin-bottom:28px}
.header h1{font-size:22px;font-weight:800;letter-spacing:-0.5px;color:#fff}
.header h1 span{color:var(--accent)}
.header p{font-size:12px;color:var(--muted);margin-top:4px;font-family:'DM Mono',monospace}

/* GLOBAL REFS */
.global-refs{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:16px}
.section-title{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin-bottom:12px}
.refs-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.ref-item label{font-size:10px;color:var(--muted);display:block;margin-bottom:5px;font-family:'DM Mono',monospace}
.ref-upload{display:flex;flex-direction:column;gap:4px}
.ref-upload-row{display:flex;align-items:center;gap:6px}
.ubtn{font-size:10px;padding:4px 10px;border:1px solid var(--border2);border-radius:5px;background:var(--surface2);color:#aaa;cursor:pointer;white-space:nowrap;font-family:'DM Mono',monospace}
.ubtn:hover{background:#1e1e1e;color:#ddd}
input[type=file]{display:none}
.iprev{width:30px;height:30px;border-radius:4px;object-fit:cover;display:none;border:1px solid var(--border2)}
.iurl{width:100%;font-size:10px;padding:4px 8px;border:1px solid var(--border);border-radius:5px;background:var(--surface2);color:#ccc;outline:none;font-family:'DM Mono',monospace}
.iurl:focus{border-color:var(--border2)}

/* VIDEO CARDS */
.vcard{background:var(--surface);border:1px solid var(--border);border-radius:12px;margin-bottom:10px;overflow:hidden}
.vhead{padding:14px 16px;display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none}
.vhead:hover{background:var(--surface2)}
.vnum{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;background:var(--surface2);color:var(--muted);flex-shrink:0;font-family:'DM Mono',monospace}
.vtitle{flex:1;font-size:13px;font-weight:700;letter-spacing:-0.2px}
.chev{font-size:12px;color:var(--muted);transition:transform .2s}
.chev.o{transform:rotate(180deg)}
.vbody{display:none;border-top:1px solid var(--border)}
.vbody.o{display:block}
.clips{padding:12px;display:flex;flex-direction:column;gap:8px}

/* CLIPS */
.clip{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:12px}
.clip-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.clip-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);flex:1;font-family:'DM Mono',monospace}
.mtag{font-size:9px;padding:2px 8px;border-radius:4px;font-weight:700;letter-spacing:.04em;font-family:'DM Mono',monospace}
.tnano{background:var(--nano-bg);color:var(--nano);border:1px solid var(--nano-border)}
.tkling{background:var(--kling-bg);color:var(--kling);border:1px solid var(--kling-border)}
.tseed{background:var(--seed-bg);color:var(--seed);border:1px solid var(--seed-border)}
.clip-prompt{font-size:11px;color:#666;line-height:1.55;margin-bottom:10px;background:#0a0a0a;border:1px solid var(--border);border-radius:5px;padding:8px 10px;font-family:'DM Mono',monospace}
.clip-settings{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.setting-chip{font-size:9px;padding:2px 7px;border-radius:3px;background:var(--surface);border:1px solid var(--border);color:var(--muted);font-family:'DM Mono',monospace}
.chain-row{font-size:10px;color:#2a3a2a;font-style:italic;margin-bottom:6px;font-family:'DM Mono',monospace}
.run-btn{width:100%;padding:8px;border:none;border-radius:6px;font-size:11px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px;transition:all .15s;font-family:'Syne',sans-serif;letter-spacing:.02em}
.run-btn:disabled{opacity:.35;cursor:not-allowed}
.run-btn.rn{background:var(--nano-bg);color:var(--nano);border:1px solid var(--nano-border)}.run-btn.rn:hover:not(:disabled){background:#112315}
.run-btn.rk{background:var(--kling-bg);color:var(--kling);border:1px solid var(--kling-border)}.run-btn.rk:hover:not(:disabled){background:#1c1040}
.run-btn.rs{background:var(--seed-bg);color:var(--seed);border:1px solid var(--seed-border)}.run-btn.rs:hover:not(:disabled){background:#0d2236}
.rarea{margin-top:8px}
.smsg{font-size:11px;padding:9px;text-align:center;background:#0a0a0a;border:1px solid var(--border);border-radius:5px;font-family:'DM Mono',monospace}
.sl{color:var(--kling)}.se{color:#f87171}.ss{color:var(--nano)}
.rimg{width:100%;border-radius:6px;display:block;border:1px solid var(--border);margin-bottom:6px}
.rvid{width:100%;border-radius:6px;display:block;border:1px solid var(--border)}
.pbtn{width:100%;margin-top:6px;padding:5px;border:1px solid var(--nano-border);border-radius:5px;background:transparent;color:var(--nano);font-size:10px;cursor:pointer;font-family:'DM Mono',monospace}
.pbtn:hover{background:var(--nano-bg)}
.divider{height:1px;background:var(--border);margin:4px 0}
</style>
</head>
<body>

<div class="header">
  <h1>🌸 Crochet <span>Pipeline</span></h1>
  <p>nano banana 2 → kling 3.0 → seedance 2 // organic dropshipping</p>
</div>

<!-- GLOBAL REFS -->
<div class="global-refs">
  <div class="section-title">Global References — upload once, used everywhere</div>
  <div class="refs-grid" id="grefgrid"></div>
</div>

<div id="pipeline"></div>

<script>
const REFS = {
  girl: 'https://i.ibb.co/hx9BWcYk/b8c6e5d1a850216f407402376a826deb.jpg',
  stall: 'https://i.ibb.co/QFy18YnS/Stallphoto1.jpg',
  bouquet: 'https://i.ibb.co/mrhVYM0q/Boquet.jpg',
  garage: 'https://i.ibb.co/XfB0LL4D/83b912ea00c0113ad43d6ecc077330fc-1780564197-fastag2a.jpg',
  dye: 'https://i.ibb.co/1JpttZCj/Young-girl-dipping-yarn.jpg',
  dad: 'https://i.ibb.co/4nTjC2W4/1.jpg'
};

const STORE = {...REFS};
const get = k => STORE[k]||null;
const set = (k,v) => { STORE[k]=v; };

const GLOBALS = [
  {key:'girl', label:'Girl ref'},
  {key:'stall', label:'Stall ref'},
  {key:'bouquet', label:'Bouquet ref'},
  {key:'garage', label:'Garage studio ref'},
  {key:'dye', label:'Dye ref'},
  {key:'dad', label:'Dad ref'}
];

const VIDEOS = [
  {
    id:'v1', title:'Video 1 — Dad Hook',
    clips:[
      {
        id:'v1c1', label:'Dad + girl image', model:'nano', type:'image', outputKey:'v1c1_img',
        refs:['girl','bouquet','garage','dad'],
        prompt:'The girl from ref 1 and the man from ref 4 are sitting together at a table in a garage studio like ref 3. The girl looks exactly like ref 1 — curly dark hair, gold necklace. The man looks like ref 4 — short grey-brown hair, stubble, white t-shirt, her dad. She is crocheting blue flowers from ref 2 as the dad sits next to her with a concerned look, about to say something. Freeze frame from a candid iPhone 12 video. Natural indoor lighting. No UI, no grain, no colour grading.',
        settings:['2K','9:16']
      },
      {
        id:'v1c2', label:'Dad hook video', model:'kling', type:'video',
        refs:['v1c1_img'],
        prompt:'The dad gently turns to his daughter and says "Nobody is going to buy your crochet flowers honey, I\'m sorry." She slows down her crocheting, her expression drops slightly. Camera mostly still, subtle natural movement. Natural indoor lighting. No UI. Raw iPhone footage feel.',
        settings:['4s','9:16','std','sound on','multi_shots: true']
      }
    ]
  },
  {
    id:'v2', title:'Video 2 — Comment Hook',
    clips:[
      {
        id:'v2c1', label:'Crying selfie image', model:'nano', type:'image', outputKey:'v2c1_img',
        refs:['girl','garage'],
        prompt:'Selfie angle shot — we are the phone camera looking at the girl\'s face. The girl from ref 1 is filming herself like a selfie in a bright room with natural daylight, simple background. She is crying, tears on her face, visibly upset. In her left hand slightly to the side she is holding a second phone reading something off the screen. Slightly above selfie angle. She looks exactly like ref 1 — same face, curly dark hair, gold necklace. Freeze frame from a selfie video. No UI, no grain, no colour grading.',
        settings:['2K','9:16']
      },
      {
        id:'v2c2', label:'Crying selfie video', model:'kling', type:'video',
        refs:['v2c1_img'],
        prompt:'The girl is crying, wiping tears, reading something off a second phone in her left hand. She sniffles and tries to compose herself. Selfie angle, camera slightly above looking at her face. Mostly still camera. Natural daylight. No UI.',
        settings:['4s','9:16','std','sound on','multi_shots: true']
      }
    ]
  },
  {
    id:'v3', title:'B-Roll — Crocheting',
    clips:[
      {
        id:'v3c1', label:'Crocheting image', model:'nano', type:'image', outputKey:'v3c1_img',
        refs:['girl','garage','bouquet'],
        prompt:'The girl from ref 1 is sitting alone in her garage studio like ref 2 crocheting a blue flower like ref 3. She looks exactly like ref 1. She is focused and calm, eyes glued to her work, does not know she is being filmed. Angle from slightly behind her shoulder. Natural indoor lighting. Freeze frame from a candid iPhone video. No UI, no grain, no colour grading.',
        settings:['2K','9:16']
      },
      {
        id:'v3c2', label:'Crocheting video', model:'kling', type:'video',
        refs:['v3c1_img'],
        prompt:'The girl is crocheting a blue flower, focused and calm, does not know she is being filmed. Eyes glued to her work. Slow deliberate movements, taking her time. Fixed stable camera, no zoom, no movement. Natural indoor lighting. No UI.',
        settings:['4s','16:9','std','no sound','multi_shots: true']
      }
    ]
  },
  {
    id:'v4', title:'B-Roll — Bouquet Assembly',
    clips:[
      {
        id:'v4c1', label:'Assembly image', model:'nano', type:'image', outputKey:'v4c1_img',
        refs:['girl','garage','bouquet'],
        prompt:'The girl from ref 1 is in her garage studio like ref 2 assembling a blue crochet flower bouquet like ref 3. She is carefully gluing the stems together with a glue gun. Focused and precise. Angle from slightly in front. Natural indoor lighting. Freeze frame from a candid iPhone video. No UI, no grain, no colour grading.',
        settings:['2K','9:16']
      },
      {
        id:'v4c2', label:'Assembly video', model:'kling', type:'video',
        refs:['v4c1_img'],
        prompt:'The girl is carefully assembling a blue crochet bouquet, gluing stems together one by one. Slow and precise movements. She does not know she is being filmed. Fixed stable camera. Natural indoor lighting. No UI.',
        settings:['4s','16:9','std','no sound','multi_shots: true']
      }
    ]
  },
  {
    id:'v5', title:'B-Roll — Dye Dipping',
    clips:[
      {
        id:'v5c1', label:'Dye image', model:'nano', type:'image', outputKey:'v5c1_img',
        refs:['girl','dye'],
        prompt:'The girl from ref 1 in her garage studio like ref 2. Black latex gloves, tongs, holding a white yarn ball above a clear tub of swirling light blue dye, about to dip it. Nice lighting. Freeze frame. No UI, no grain, no colour grading. iPhone 14 quality.',
        settings:['2K','9:16']
      },
      {
        id:'v5c2', label:'Dye video', model:'kling', type:'video',
        refs:['v5c1_img'],
        prompt:'The girl slowly and cautiously dips the yarn ball into the blue dye using tongs. Precise and careful like a scientist. Realistic liquid physics. Slow humanlike actions. Fixed stable camera. Good lighting. No UI.',
        settings:['4s','16:9','std','no sound','multi_shots: true']
      }
    ]
  }
];

function toB64(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file);});}

function renderGlobals(){
  const grid=document.getElementById('grefgrid');
  GLOBALS.forEach(g=>{
    const d=document.createElement('div');
    d.innerHTML=`
      <label>${g.label}</label>
      <div class="ref-upload">
        <div class="ref-upload-row">
          <label class="ubtn" for="gf_${g.key}">📎 Upload</label>
          <input type="file" id="gf_${g.key}" accept="image/*">
          <img class="iprev" id="gp_${g.key}" src="${get(g.key)||''}" style="${get(g.key)?'display:block':''}">
        </div>
        <input type="text" class="iurl" id="gu_${g.key}" placeholder="or paste URL" value="${get(g.key)||''}">
      </div>`;
    grid.appendChild(d);
    setTimeout(()=>{
      document.getElementById('gf_'+g.key).addEventListener('change',async e=>{
        const f=e.target.files[0];if(!f)return;
        const b=await toB64(f);set(g.key,b);
        const p=document.getElementById('gp_'+g.key);p.src=b;p.style.display='block';
      });
      document.getElementById('gu_'+g.key).addEventListener('blur',e=>{
        const v=e.target.value.trim();if(v){set(g.key,v);const p=document.getElementById('gp_'+g.key);p.src=v;p.style.display='block';}
      });
    },0);
  });
}

function renderPipeline(){
  const cont=document.getElementById('pipeline');
  VIDEOS.forEach((vid,vi)=>{
    const card=document.createElement('div');card.className='vcard';
    const head=document.createElement('div');head.className='vhead';
    head.innerHTML=`<div class="vnum">${vi+1}</div><div class="vtitle">${vid.title}</div><div class="chev" id="ch_${vid.id}">▾</div>`;
    const body=document.createElement('div');body.className='vbody'+(vi===0?' o':'');body.id='vb_'+vid.id;
    const clips=document.createElement('div');clips.className='clips';
    vid.clips.forEach(c=>clips.appendChild(buildClip(c)));
    body.appendChild(clips);card.appendChild(head);card.appendChild(body);
    cont.appendChild(card);
    head.addEventListener('click',()=>{
      body.classList.toggle('o');
      document.getElementById('ch_'+vid.id).classList.toggle('o',body.classList.contains('o'));
    });
  });
}

function buildClip(clip){
  const div=document.createElement('div');div.className='clip';
  const mc={nano:'tnano',kling:'tkling',seedance:'tseed'};
  const ml={nano:'Nano Banana 2',kling:'Kling 3.0',seedance:'Seedance 2'};
  const bc={nano:'rn',kling:'rk',seedance:'rs'};
  const bt=clip.type==='image'?'🖼 Generate Image':'🎬 Generate Video';
  const chains=clip.refs.map(r=>r.includes('_img')?`<div class="chain-row">↳ ${r} (auto from previous step)</div>`:'').join('');
  const settings=clip.settings.map(s=>`<span class="setting-chip">${s}</span>`).join('');
  div.innerHTML=`
    <div class="clip-head"><span class="clip-label">${clip.label}</span><span class="mtag ${mc[clip.model]}">${ml[clip.model]}</span></div>
    <div class="clip-prompt">${clip.prompt}</div>
    <div class="clip-settings">${settings}</div>
    ${chains}
    <button class="run-btn ${bc[clip.model]}" id="btn_${clip.id}">${bt}</button>
    <div class="rarea" id="ra_${clip.id}"></div>`;
  setTimeout(()=>{
    const btn=document.getElementById('btn_'+clip.id);
    if(btn) btn.addEventListener('click',()=>runClip(clip));
  },0);
  return div;
}

function stat(id,msg,type){document.getElementById('ra_'+id).innerHTML=`<div class="smsg ${type}">${msg}</div>`;}
function showImg(id,url,key){
  document.getElementById('ra_'+id).innerHTML=`<img class="rimg" src="${url}"><button class="pbtn" onclick="saveRef('${key}','${url}',this)">✓ Use as reference for next step</button>`;
  if(key) set(key,url);
}
function showVid(id,url){document.getElementById('ra_'+id).innerHTML=`<video class="rvid" src="${url}" controls loop></video>`;}
window.saveRef=(k,url,btn)=>{set(k,url);btn.textContent='✓ Saved!';};

function getRefs(clip){return clip.refs.map(r=>get(r)).filter(Boolean);}

async function runClip(clip){
  const btn=document.getElementById('btn_'+clip.id);
  btn.disabled=true;
  stat(clip.id,'⏳ Generating…','sl');
  try{
    const refs=getRefs(clip);
    if(clip.model==='nano') await runNano(clip,refs);
    else if(clip.model==='kling') await runKling(clip,refs);
    else await runSeedance(clip,refs);
  }catch(e){stat(clip.id,'❌ '+e.message,'se');console.error(e);}
  btn.disabled=false;
}

async function callAnthropic(systemPrompt, userMsg){
  const res=await fetch('https://api.anthropic.com/v1/messages',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({
      model:'claude-sonnet-4-20250514',
      max_tokens:2000,
      system:systemPrompt,
      messages:[{role:'user',content:userMsg}],
      mcp_servers:[{type:'url',url:'https://api.kie.ai/mcp',name:'kie-ai'}]
    })
  });
  if(!res.ok) throw new Error('API error '+res.status);
  return res.json();
}

async function runNano(clip,refs){
  const data=await callAnthropic(
    'You are an image generation assistant. Use the nano_banana_image tool to generate an image. After generation completes, respond ONLY with JSON: {"image_url":"<url>"}. No other text.',
    `Generate image with nano_banana_image:\nPrompt: ${clip.prompt}\nAspect ratio: 9:16\nResolution: 2K\n${refs.length?'Reference images (image_input): '+refs.slice(0,5).join(', '):''}\n\nCall the tool then return JSON with the image URL.`
  );
  const text=data.content?.filter(c=>c.type==='text').map(c=>c.text).join('')||'';
  try{const p=JSON.parse(text.replace(/```json|```/g,'').trim());if(p.image_url){showImg(clip.id,p.image_url,clip.outputKey);}else{stat(clip.id,'⚠️ No image URL','se');console.log(data);}}
  catch{stat(clip.id,'⚠️ Parse error','se');console.log(text,data);}
}

async function runKling(clip,refs){
  const startFrame=refs[0]||null;
  const data=await callAnthropic(
    'You are a video generation assistant. Use the kling_video tool to generate a video. IMPORTANT: always set multi_shots to true and provide multi_prompt array. Wait for completion then respond ONLY with JSON: {"video_url":"<url>"}. No other text.',
    `Generate video with kling_video:\nPrompt: ${clip.prompt}\nDuration: 4\nAspect ratio: 9:16\nMode: std\nSound: ${clip.settings.includes('sound on')}\nMulti shots: true (required)\nMulti prompt: [{"duration":4,"prompt":"${clip.prompt.replace(/"/g,"'")}"}]\n${startFrame?'Start frame: '+startFrame:''}\n\nCall the tool and return JSON with video URL.`
  );
  const text=data.content?.filter(c=>c.type==='text').map(c=>c.text).join('')||'';
  try{const p=JSON.parse(text.replace(/```json|```/g,'').trim());if(p.video_url){showVid(clip.id,p.video_url);}else{stat(clip.id,'⚠️ No video URL','se');console.log(data);}}
  catch{stat(clip.id,'⚠️ Parse error','se');console.log(text,data);}
}

async function runSeedance(clip,refs){
  const data=await callAnthropic(
    'You are a video generation assistant. Use the bytedance_seedance_video tool to generate a video. Wait for completion then respond ONLY with JSON: {"video_url":"<url>"}. No other text.',
    `Generate video with bytedance_seedance_video:\nPrompt: ${clip.prompt}\nDuration: 4\nAspect ratio: 16:9\nResolution: 720p\nMode: standard\nGenerate audio: false\n${refs[0]?'First frame URL: '+refs[0]:''}\n\nCall the tool and return JSON with video URL.`
  );
  const text=data.content?.filter(c=>c.type==='text').map(c=>c.text).join('')||'';
  try{const p=JSON.parse(text.replace(/```json|```/g,'').trim());if(p.video_url){showVid(clip.id,p.video_url);}else{stat(clip.id,'⚠️ No video URL','se');console.log(data);}}
  catch{stat(clip.id,'⚠️ Parse error','se');console.log(text,data);}
}

renderGlobals();
renderPipeline();
</script>
</body>
</html>
